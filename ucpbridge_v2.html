  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --amber: #F6A93D;
      --amber2: #F8BE59;
      --amber3: #FAD474;
      --dark: #1A1A14;
      --bg: #FFFEF7;
      --gray: #666;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: 'DM Sans', sans-serif;
      background: var(--dark);
    }

    /* ── SLIDES CONTAINER ── */
    #deck {
      position: fixed;
      inset: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease, transform 0.5s ease;
      transform: translateY(30px);
      overflow: hidden;
    }

    .slide.active {
      opacity: 1;
      pointer-events: all;
      transform: translateY(0);
    }

    .slide.exit {
      opacity: 0;
      transform: translateY(-30px);
    }

    /* ── NAV BAR ── */
    #topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.75rem;
    }

    .tb-logo img {
      zoom: 0.3; /* Exatos 30% da dimensão original do arquivo PNG */
      width: auto;
      height: auto;
      transform-origin: top left;
      opacity: 1;
    }

    #progress-wrap {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .prog-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: background 0.3s, transform 0.3s;
    }

    .prog-dot.done {
      background: var(--amber);
    }

    .prog-dot.current {
      background: #fff;
      transform: scale(1.4);
    }

    /* ── BOTTOM NAV ── */
    #botnav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.25rem 1.75rem;
    }

    .nav-hint {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      font-weight: 300;
      letter-spacing: 0.04em;
    }

    .nav-btns {
      display: flex;
      gap: 0.75rem;
    }

    #btn-prev {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: transparent;
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #btn-prev:hover {
      border-color: rgba(255, 255, 255, 0.4);
      color: #fff;
    }

    #btn-next {
      display: flex;
      align-items: center;
      gap: 8px;
      background: linear-gradient(90deg, var(--amber), #ff8c00, var(--amber));
      background-size: 200% 200%;
      color: #fff;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      animation: btnBgPulse 3s ease infinite;
      box-shadow: 0 4px 15px rgba(246, 169, 61, 0.4);
    }

    #btn-next:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 8px 25px rgba(246, 169, 61, 0.6);
    }

    @keyframes btnBgPulse {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    #slide-counter {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.25);
      font-weight: 300;
    }

    /* ── TYPOGRAPHY HELPERS ── */
    .eyebrow {
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 1rem;
    }

    .h-giant {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.2rem, 6vw, 4.5rem);
      line-height: 1.04;
      letter-spacing: -0.04em;
      color: #fff;
      margin-bottom: 1.25rem;
    }

    .h-big {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(1.8rem, 4.5vw, 3.2rem);
      line-height: 1.06;
      letter-spacing: -0.035em;
      color: #fff;
      margin-bottom: 1.1rem;
    }

    .h-med {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(1.3rem, 3vw, 2rem);
      line-height: 1.1;
      letter-spacing: -0.025em;
      color: #fff;
      margin-bottom: 0.9rem;
    }

    .body-lg {
      font-size: clamp(1rem, 2vw, 1.2rem);
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.75;
      font-weight: 300;
      max-width: 640px;
    }

    .body-lg strong {
      color: #fff;
      font-weight: 500;
    }

    .body-md {
      font-size: clamp(0.9rem, 1.8vw, 1.05rem);
      color: rgba(255, 255, 255, 0.55);
      line-height: 1.7;
      font-weight: 300;
      max-width: 580px;
    }

    .body-md strong {
      color: rgba(255, 255, 255, 0.9);
      font-weight: 500;
    }

    .accent {
      color: var(--amber);
      display: inline-block;
    }

    .accent-green {
      color: #4ECDC4;
      display: inline-block;
    }

    .accent-red {
      color: #FF6B6B;
      display: inline-block;
    }

    .slide.active .accent {
      animation: popWord 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, glowAmber 2s infinite alternate 0.6s;
      opacity: 0;
    }

    .slide.active .accent-green {
      animation: popWord 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, glowGreen 2s infinite alternate 0.6s;
      opacity: 0;
    }

    .slide.active .accent-red {
      animation: popWord 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, glowRed 2s infinite alternate 0.6s;
      opacity: 0;
    }

    @keyframes popWord {
      0% {
        opacity: 0;
        transform: translateY(15px) scale(0.8);
      }

      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glowAmber {
      0% {
        text-shadow: 0 0 0 rgba(246, 169, 61, 0);
      }

      100% {
        text-shadow: 0 0 25px rgba(246, 169, 61, 0.8);
      }
    }

    @keyframes glowGreen {
      0% {
        text-shadow: 0 0 0 rgba(78, 205, 196, 0);
      }

      100% {
        text-shadow: 0 0 25px rgba(78, 205, 196, 0.8);
      }
    }

    @keyframes glowRed {
      0% {
        text-shadow: 0 0 0 rgba(255, 107, 107, 0);
      }

      100% {
        text-shadow: 0 0 25px rgba(255, 107, 107, 0.8);
      }
    }

    /* ── SLIDE BACKGROUNDS ── */
    .bg-dark {
      background: var(--dark);
    }

    .bg-amber {
      background: var(--amber);
    }

    .bg-light {
      background: var(--bg);
    }

    .bg-dark .h-giant,
    .bg-dark .h-big,
    .bg-dark .h-med {
      color: #fff;
    }

    .bg-amber .h-giant,
    .bg-amber .h-big,
    .bg-amber .h-med,
    .bg-amber .eyebrow {
      color: #1A1A14;
    }

    .bg-amber .body-lg,
    .bg-amber .body-md {
      color: rgba(26, 26, 20, 0.7);
    }

    .bg-amber .body-lg strong,
    .bg-amber .body-md strong {
      color: #1A1A14;
    }

    .bg-light .h-giant,
    .bg-light .h-big,
    .bg-light .h-med {
      color: #1A1A14;
    }

    .bg-light .eyebrow {
      color: var(--amber);
    }

    .bg-light .body-lg,
    .bg-light .body-md {
      color: #666;
    }

    .bg-light .body-lg strong,
    .bg-light .body-md strong {
      color: #1A1A14;
    }

    /* ── GRID CARDS ── */
    .cards-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      max-width: 720px;
      width: 100%;
      margin-top: 1.5rem;
    }

    .cards-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      max-width: 820px;
      width: 100%;
      margin-top: 1.5rem;
    }

    .card {
      border-radius: 14px;
      padding: 1.4rem;
      border: 1px solid;
      text-align: left;
    }

    .card-dark {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .card-amber {
      background: rgba(246, 169, 61, 0.1);
      border-color: rgba(246, 169, 61, 0.25);
    }

    .card-light {
      background: rgba(26, 26, 20, 0.04);
      border-color: rgba(26, 26, 20, 0.1);
    }

    .card h4 {
      font-family: 'Syne', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
      letter-spacing: -0.01em;
    }

    .card-dark h4 {
      color: #fff;
    }

    .card-amber h4 {
      color: #fff;
    }

    .card-light h4 {
      color: #1A1A14;
    }

    .card p {
      font-size: 0.82rem;
      line-height: 1.6;
      font-weight: 300;
    }

    .card-dark p {
      color: rgba(255, 255, 255, 0.5);
    }

    .card-amber p {
      color: rgba(255, 255, 255, 0.65);
    }

    .card-light p {
      color: #666;
    }

    .card-num {
      font-family: 'Syne', sans-serif;
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--amber);
      opacity: 0.4;
      margin-bottom: 0.4rem;
      line-height: 1;
    }

    /* ── CHAT DEMO ── */
    .chat-demo {
      max-width: 520px;
      width: 100%;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      text-align: left;
    }

    .chat-msg {
      padding: 0.9rem 1.1rem;
      border-radius: 14px;
      font-size: 0.9rem;
      line-height: 1.55;
      font-weight: 300;
      animation: fadeUp 0.4s ease both;
    }

    .chat-user {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.8);
      border-radius: 14px 14px 4px 14px;
      align-self: flex-end;
      max-width: 85%;
    }

    .chat-ai {
      background: rgba(246, 169, 61, 0.12);
      border: 1px solid rgba(246, 169, 61, 0.25);
      color: rgba(255, 255, 255, 0.85);
      border-radius: 14px 14px 14px 4px;
      max-width: 90%;
    }

    .chat-ai strong {
      color: var(--amber);
      font-weight: 500;
    }

    .chat-label {
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 0.2rem;
    }

    .chat-label.user {
      color: rgba(255, 255, 255, 0.3);
      text-align: right;
    }

    .chat-label.ai {
      color: rgba(246, 169, 61, 0.6);
    }

    .chat-confirm {
      background: #25D366;
      color: #fff;
      border: none;
      padding: 0.75rem 1.5rem;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      align-self: center;
      margin-top: 0.5rem;
      animation: fadeUp 0.4s ease 0.6s both;
      transition: background 0.2s;
    }

    .chat-confirm:hover {
      background: #1ebe5d;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── STAT CALLOUT ── */
    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 1.5rem 0;
    }

    .stat-num {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(4rem, 12vw, 8rem);
      line-height: 1;
      color: var(--amber);
      letter-spacing: -0.05em;
    }

    .stat-desc {
      font-size: clamp(0.9rem, 2vw, 1.1rem);
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
      margin-top: 0.5rem;
    }

    /* ── VS BLOCK ── */
    .vs-block {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 1.25rem;
      max-width: 680px;
      width: 100%;
      margin-top: 1.5rem;
      align-items: start;
    }

    .vs-side {
      border-radius: 14px;
      padding: 1.25rem;
      border: 1px solid;
    }

    .vs-old {
      background: rgba(255, 107, 107, 0.05);
      border-color: rgba(255, 107, 107, 0.2);
    }

    .vs-new {
      background: rgba(78, 205, 196, 0.05);
      border-color: rgba(78, 205, 196, 0.2);
    }

    .vs-label {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 0.75rem;
    }

    .vs-old .vs-label {
      color: rgba(255, 107, 107, 0.6);
    }

    .vs-new .vs-label {
      color: rgba(78, 205, 196, 0.6);
    }

    .vs-item {
      font-size: 0.82rem;
      color: rgba(255, 255, 255, 0.6);
      padding: 0.35rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.4;
      font-weight: 300;
    }

    .vs-item:last-child {
      border-bottom: none;
    }

    .vs-item.bad {
      color: rgba(255, 107, 107, 0.7);
    }

    .vs-item.good {
      color: rgba(78, 205, 196, 0.8);
    }

    .vs-divider {
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.2);
      padding-top: 2rem;
    }

    /* ── TIMELINE ── */
    .timeline {
      max-width: 540px;
      width: 100%;
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0;
      position: relative;
      text-align: left;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 18px;
      top: 20px;
      bottom: 20px;
      width: 2px;
      background: rgba(246, 169, 61, 0.15);
    }

    .tl-item {
      display: flex;
      gap: 1rem;
      padding: 0.75rem 0;
      align-items: flex-start;
    }

    .tl-dot {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(246, 169, 61, 0.15);
      border: 1px solid rgba(246, 169, 61, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .tl-dot span {
      font-family: 'Syne', sans-serif;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--amber);
    }

    .tl-body h5 {
      font-family: 'Syne', sans-serif;
      font-size: 0.9rem;
      font-weight: 700;
      color: #fff;
      margin-bottom: 0.2rem;
    }

    .tl-body p {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.45);
      font-weight: 300;
      line-height: 1.5;
    }

    /* ── WA BUTTON ── */
    .wa-btn {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      background: #25D366;
      color: #fff;
      border: none;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
      margin-top: 1.5rem;
    }

    .wa-btn:hover {
      background: #1ebe5d;
      transform: translateY(-2px);
    }

    /* ── PILL ── */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(246, 169, 61, 0.12);
      border: 1px solid rgba(246, 169, 61, 0.3);
      border-radius: 50px;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--amber);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1.25rem;
    }

    .pill-dot {
      width: 6px;
      height: 6px;
      background: var(--amber);
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.4;
        transform: scale(0.7);
      }
    }

    /* ── QUOTE BLOCK ── */
    .quote {
      max-width: 560px;
      border-left: 3px solid var(--amber);
      padding: 1rem 1.5rem;
      margin-top: 1.5rem;
      text-align: left;
    }

    .quote p {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.75);
      line-height: 1.7;
      font-style: italic;
      font-weight: 300;
    }

    .quote cite {
      font-size: 0.78rem;
      color: rgba(255, 255, 255, 0.3);
      margin-top: 0.5rem;
      display: block;
      font-style: normal;
    }

    /* ── BIG NUMBERS GRID ── */
    .bignums {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
      max-width: 680px;
      width: 100%;
      margin-top: 1.5rem;
    }

    .bignum-cell {
      text-align: center;
    }

    .bignum-val {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2rem, 5vw, 3.2rem);
      color: var(--amber);
      letter-spacing: -0.04em;
      line-height: 1;

    let current = 0;
    const total = slides.length;

    function buildDeck() {
      const deck = document.getElementById('deck');
      const pw = document.getElementById('progress-wrap');
      deck.innerHTML = '';
      pw.innerHTML = '';
      slides.forEach((s, i) => {
        const div = document.createElement('div');
        div.className = 'slide ' + s.bg;
        div.id = 'slide-' + i;
        div.innerHTML = s.html;
        deck.appendChild(div);
        const dot = document.createElement('div');
        dot.className = 'prog-dot';
        dot.id = 'dot-' + i;
        pw.appendChild(dot);
      });
    }

    function goSlide(dir) {
      const next = current + dir;
      if (next < 0 || next >= total) return;
      const cur = document.getElementById('slide-' + current);
      cur.classList.remove('active');
      cur.classList.add('exit');
      setTimeout(() => cur.classList.remove('exit'), 500);
      current = next;
      const nxt = document.getElementById('slide-' + current);
      nxt.classList.add('active');
      update();
    }

    function update() {
      document.querySelectorAll('.prog-dot').forEach((d, i) => {
        d.className = 'prog-dot' + (i < current ? ' done' : i === current ? ' current' : '');
      });
      document.getElementById('slide-counter').textContent = (current + 1) + ' / ' + total;
      document.getElementById('btn-prev').style.opacity = current === 0 ? '0.2' : '1';
      document.getElementById('btn-prev').style.pointerEvents = current === 0 ? 'none' : 'all';
      const isLast = current === total - 1;
      document.getElementById('btn-label').textContent = isLast ? 'Falar no WhatsApp' : 'Próximo';
      if (isLast) {
        document.getElementById('btn-next').onclick = () => window.open(WA, '_blank');
      } else {
        document.getElementById('btn-next').onclick = () => goSlide(1);
      }
      const hints = ['Clique para avançar', 'Use as setas ou aperte → no teclado', '', '', '', '', '', '', '', '', '', '', '', 'Última tela'];
      document.getElementById('nav-hint').textContent = hints[current] || '';
    }

    // keyboard
    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ') goSlide(1);
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') goSlide(-1);
    });

    // touch
    let tx = 0;
    document.addEventListener('touchstart', e => tx = e.touches[0].clientX);
    document.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) goSlide(dx < 0 ? 1 : -1);
    });

    buildDeck();
    document.getElementById('slide-0').classList.add('active');
    update();
  </script>
